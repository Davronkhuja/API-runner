<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>API Runner — muhit muharriri</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4338CA}a:hover{color:#312E81}
.th-light{--bg:#F6F7F9;--panel:#FFFFFF;--border:#E2E5EA;--border-strong:#D3D7DE;--text:#151821;--muted:#596170;--subtle:#F1F3F6;--hover:#EBEEF3;--accent-text:#4338CA;--accent-weak:#EEF0FF;--dev:#157A3A;--test:#1D4ED8;--prod:#B45309;--prod-bg:#FFF4E5}
.th-dark{--bg:#0E1015;--panel:#151820;--border:#252933;--border-strong:#323743;--text:#E7E9EE;--muted:#9AA2B1;--subtle:#1B1F28;--hover:#1F2430;--accent-text:#A5B4FC;--accent-weak:#1E2142;--dev:#4ADE80;--test:#60A5FA;--prod:#FBBF24;--prod-bg:#2D2212}
.env{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--text);font:500 13px Inter,sans-serif;text-align:left;cursor:pointer}
.env:hover{background:var(--hover)}
.env.on{background:var(--accent-weak)}
.btn{height:32px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font:500 12.5px Inter,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.pri{height:32px;padding:0 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:600 12.5px Inter,sans-serif;cursor:pointer}
.cell{width:100%;height:38px;padding:0 10px;border:0;background:transparent;color:var(--text);font:400 12.5px 'JetBrains Mono',monospace;outline:none;box-sizing:border-box}
.cell:focus{background:var(--accent-weak)}
.cell::placeholder{color:var(--muted)}
.gr{display:grid;grid-template-columns:36px minmax(0,1fr) 110px minmax(0,1.3fr) minmax(0,1.3fr) 40px;align-items:center}
.chk{width:15px;height:15px;accent-color:var(--accent);margin:0}
.chip{height:26px;padding:0 10px;border:1px solid var(--border);border-radius:13px;background:var(--panel);color:var(--muted);font:500 12px Inter;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:currentColor;font-weight:600}
.ib{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.ib:hover{background:var(--hover);color:var(--text)}
</style>
</helmet>
<div class="{{themeClass}}" style="--accent: {{accent}}; width: 100%; height: 900px; display: flex; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 13px; overflow: hidden; flex-wrap: wrap">
  <aside style="width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding: 16px 10px; background: var(--panel); border-right: 1px solid var(--border)">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 6px 8px"><span style="font-weight: 600; font-size: 14px">Muhitlar</span><button class="ib" aria-label="Yangi muhit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <sc-for list="{{envs}}" as="e" hint-placeholder-count="5">
      <button class="{{e.cls}}" onClick="{{e.pick}}">
        <span style="width: 9px; height: 9px; border-radius: 50%; background: {{e.dot}}"></span>
        <span style="flex: 1"><span style="display: block">{{e.name}}</span><span style="display: block; font: 400 11.5px Inter; color: var(--muted)">{{e.meta}}</span></span>
        <sc-if value="{{e.active}}" hint-placeholder-val="{{ false }}"><span style="font: 600 10.5px Inter; color: var(--accent-text)">FAOL</span></sc-if>
      </button>
    </sc-for>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; padding: 24px 32px; gap: 18px; overflow-y: auto">
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
      <input aria-label="Muhit nomi" value="{{cur.name}}" style="border: 1px solid transparent; border-radius: 6px; padding: 2px 6px; margin-left: -6px; background: transparent; color: var(--text); font: 700 22px Inter; width: 340px; outline: none">
      <div style="flex: 1"></div>
      <button class="btn">Dublikat</button>
      <button class="btn">Eksport</button>
      <button class="pri">Faol qilish</button>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
      <span style="font: 600 12px Inter; color: var(--muted); margin-right: 4px">Turi:</span>
      <button class="{{chipDev}}" style="color: var(--dev)"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--dev)"></span>Dev</button>
      <button class="{{chipTest}}" style="color: var(--test)"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--test)"></span>Test</button>
      <button class="{{chipProd}}" style="color: var(--prod)"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--prod)"></span>Prod</button>
      <sc-if value="{{cur.prod}}" hint-placeholder-val="{{ false }}">
        <label style="display: flex; align-items: center; gap: 8px; margin-left: 12px; padding: 6px 12px; border-radius: 8px; background: var(--prod-bg); color: var(--prod); font-weight: 500"><input type="checkbox" class="chk" checked="{{ true }}">POST / PUT / DELETE yuborishdan oldin tasdiq so'ralsin</label>
      </sc-if>
    </div>

    <div style="display: flex; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--subtle); font-size: 12.5px; line-height: 1.55; color: var(--muted)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0; margin-top: 2px" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      <span><b style="color: var(--text)">Boshlang'ich qiymat</b> eksport va zaxiraga tushadi. <b style="color: var(--text)">Joriy qiymat</b> faqat shu kompyuterda saqlanadi: tokenlar va parollarni shu ustunga yozing. Skriptlar faqat joriy qiymatni o'zgartiradi.</span>
    </div>

    <div style="border: 1px solid var(--border); border-radius: 10px; background: var(--panel); overflow: hidden">
      <div class="gr" style="height: 34px; background: var(--subtle); font: 600 11.5px Inter; color: var(--muted)">
        <span></span><span style="padding: 0 10px">O'zgaruvchi</span><span style="padding: 0 10px">Turi</span><span style="padding: 0 10px">Boshlang'ich qiymat</span><span style="padding: 0 10px">Joriy qiymat</span><span></span>
      </div>
      <sc-for list="{{vars}}" as="v" hint-placeholder-count="5">
        <div class="gr" style="border-top: 1px solid var(--border)">
          <span style="display: flex; justify-content: center"><input type="checkbox" class="chk" aria-label="Yoqish" checked="{{v.on}}"></span>
          <input class="cell" aria-label="Nomi" value="{{v.k}}">
          <select aria-label="Turi" style="height: 30px; margin: 0 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: 400 12px Inter"><option>{{v.type}}</option><option>default</option><option>secret</option></select>
          <input class="cell" aria-label="Boshlang'ich qiymat" value="{{v.init}}" style="border-left: 1px solid var(--border); color: var(--muted)">
          <input class="cell" aria-label="Joriy qiymat" value="{{v.cur}}" style="border-left: 1px solid var(--border)">
          <sc-if value="{{v.secret}}" hint-placeholder-val="{{ false }}"><button class="ib" aria-label="Qiymatni ko'rsatish" onClick="{{reveal}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></sc-if>
          <sc-if value="{{v.plain}}" hint-placeholder-val="{{ true }}"><span></span></sc-if>
        </div>
      </sc-for>
      <div class="gr" style="border-top: 1px solid var(--border)">
        <span></span><input class="cell" aria-label="Yangi o'zgaruvchi" placeholder="Yangi o'zgaruvchi"><span></span><input class="cell" aria-label="Boshlang'ich qiymat" placeholder="Qiymat" style="border-left: 1px solid var(--border)"><input class="cell" aria-label="Joriy qiymat" placeholder="Qiymat" style="border-left: 1px solid var(--border)"><span></span>
      </div>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button class="btn">Joriy → boshlang'ich (hammasi)</button>
      <button class="btn">Joriy qiymatlarni tiklash</button>
      <div style="flex: 1"></div>
      <span style="align-self: center; font-size: 12px; color: var(--muted)">Bu muhitni 9 ta so'rov ishlatadi</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#4F46E5","options":["#4F46E5","#0E7490","#C2410C","#15803D"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'om-prod', show: false }; }
  renderVals() {
    const dark = !!this.props.dark, s = this.state;
    const list = [
      { id: 'globals', name: 'Globals', meta: '3 ta o\'zgaruvchi · har doim', dot: 'var(--muted)', kind: '' },
      { id: 'om-dev', name: 'Online Mahalla — dev', meta: '5 ta o\'zgaruvchi', dot: 'var(--dev)', kind: 'dev' },
      { id: 'om-prod', name: 'Online Mahalla — prod', meta: '5 ta · 2 ta secret', dot: 'var(--prod)', kind: 'prod', active: true },
      { id: 'ijara-dev', name: 'Ijara — dev', meta: '6 ta o\'zgaruvchi', dot: 'var(--dev)', kind: 'dev' },
      { id: 'test', name: 'Test Env', meta: '2 ta o\'zgaruvchi', dot: 'var(--test)', kind: 'test' }
    ];
    const cur = list.find(e => e.id === s.sel);
    const envs = list.map(e => ({ ...e, active: !!e.active, cls: e.id === s.sel ? 'env on' : 'env', pick: () => this.setState({ sel: e.id }) }));
    const mask = '••••••••••••';
    const vars = [
      { k: 'base_url', type: 'default', init: 'https://api.online-mahalla.uz/api', cur: 'https://api.online-mahalla.uz/api', on: true },
      { k: 'om_token', type: 'secret', init: '', cur: s.show ? 'eyJhbGciOi…[TOKEN]' : mask, on: true, secret: true },
      { k: 'pinfl', type: 'default', init: '[PINFL]', cur: '[PINFL]', on: true },
      { k: 'client_secret', type: 'secret', init: '', cur: s.show ? '[SECRET]' : mask, on: true, secret: true },
      { k: 'timeout_ms', type: 'default', init: '30000', cur: '30000', on: false }
    ].map(v => ({ ...v, secret: !!v.secret, plain: !v.secret }));
    const chip = (k) => (cur.kind === k ? 'chip on' : 'chip');
    return {
      themeClass: dark ? 'th-dark' : 'th-light', accent: this.props.accent ?? '#4F46E5',
      envs, cur: { ...cur, prod: cur.kind === 'prod' }, vars,
      chipDev: chip('dev'), chipTest: chip('test'), chipProd: chip('prod'),
      reveal: () => this.setState({ show: !s.show })
    };
  }
}
</script>
</body>
</html>
